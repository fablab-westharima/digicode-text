; Dedicated ESP32-C6 project: existing RP2040 / ESP32 / ESP32-S3 / ESP32-C5 / ESP32-C3 /
; ESP32-P4 / ESP8266 environments are unchanged.

; ESP32: pioarduino's community platform (arduino-esp32 3.x), not the official espressif32.
; It is not in the PlatformIO registry, so the release zip URL is the only way to name a
; version; the tag is pinned so a build here never follows the platform's own moving target.
; The platform carries seeed_xiao_esp32c6 itself (4MB flash, XIAO_ESP32C6 variant, and the
; USB CDC flags in its own extra_flags), so no board definition is needed in this project.
[env:xiao_esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
extra_scripts =
    pre:portable_paths.py
    post:package_firmware.py
