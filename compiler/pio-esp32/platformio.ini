; Dedicated classic-ESP32 project: existing RP2040 / ESP32-C3 / ESP8266 environments are unchanged.

; ESP32: pioarduino's community platform (arduino-esp32 3.x), not the official espressif32.
; It is not in the PlatformIO registry, so the release zip URL is the only way to name a
; version; the tag is pinned so a build here never follows the platform's own moving target.
; Partitions are the board definition's own default (4MB flash), not overridden here.
[env:esp32_devkitc_v4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32dev
framework = arduino
extra_scripts =
    pre:portable_paths.py
    post:package_firmware.py

; M5Stack ATOM Lite と ATOM Matrix。中身は 2 台とも ESP32-PICO-D4（4MB flash・PSRAM 無し）で、
; Matrix で増えるのは 5x5 の LED マトリクスと IMU（MPU6886）だけなので build の設定に差は無い。
; だから env は 1 つで、BOARDS の 2 つのボードがこれを共有する（server.mjs の env）。
; 定義は platform 自身の m5stack-atom：variant は m5stack_atom で、partitions は board 定義の
; 既定（4MB flash）のまま。自作 json は置いていない。
; USB-C は基板の USB シリアル変換チップ経由で、ESP32 の UART（GPIO1/GPIO3）に繋がる。
; チップに直結する USB は無いので、-DARDUINO_USB_* の指定は要らない。
[env:m5stack_atom]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = m5stack-atom
framework = arduino
extra_scripts =
    pre:portable_paths.py
    post:package_firmware.py

; M5Stack StickC Plus2。pioarduino 55.03.312 が持つ M5Stick 系の定義は m5stick-c（ESP32-PICO-D4、
; 4MB flash・PSRAM 無し）だけで、この板の実機仕様（ESP32-PICO-V3-02、8MB flash・2MB PSRAM）とは
; 別物なので、定義は compiler/pio-esp32/boards/m5stack-stickc-plus2.json に置く。
; 値は core 自身の boards.txt の m5stack_stickc_plus2 に合わせた（8MB flash、flash_freq 80m、
; flash_mode dio、partitions default_8MB、PSRAM 有効時の 3 つのフラグ）。variant も core が
; その board に割り当てている m5stack_stickc_plus2。
; USB-C は基板の USB シリアル変換チップ（CH9102）経由で、ESP32 の UART（GPIO1/GPIO3）に繋がる。
; チップに直結する USB は無いので、-DARDUINO_USB_* の指定は要らない。
[env:m5stack_stickc_plus2]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = m5stack-stickc-plus2
framework = arduino
extra_scripts =
    pre:portable_paths.py
    post:package_firmware.py
