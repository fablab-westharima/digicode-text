; Dedicated ESP32-C5 project: existing RP2040 / ESP32 / ESP32-S3 / ESP32-C3 / ESP8266
; environments are unchanged.

; ESP32: pioarduino's community platform (arduino-esp32 3.x), not the official espressif32.
; It is not in the PlatformIO registry, so the release zip URL is the only way to name a
; version; the tag is pinned so a build here never follows the platform's own moving target.
; Partitions are the board definition's own default_8MB.csv (8MB flash), not overridden here.
[env:xiao_esp32c5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = seeed_xiao_esp32c5
framework = arduino
extra_scripts =
    pre:portable_paths.py
    post:package_firmware.py

; ESP32-C5-DevKitC-1: the platform carries N4 / N8R4 / N16R4 definitions but not the N8R8 that
; 秋月 131642 sells, so the definition lives in this project's own boards/ directory
; (boards/esp32_c5_devkitc_1_n8r8.json): 8MB flash, default_8MB.csv, quad PSRAM — quad because
; the ESP32-C5 datasheet's PSRAM pin mapping lists only Single SPI and Quad SPI, no octal.
; The board has two USB-C ports; the one wired straight to the chip (GPIO13/14) is the one this
; app flashes and reads Serial through, so the USB CDC flags are set here. The board definition
; does not carry them (the XIAO C5 one does), and without them Serial goes to UART0 instead.
[env:esp32_c5_devkitc_1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32_c5_devkitc_1_n8r8
framework = arduino
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
extra_scripts =
    pre:portable_paths.py
    post:package_firmware.py
