; Dedicated ESP32-S3 project: existing RP2040 / ESP32 / ESP32-C3 / ESP8266 environments are unchanged.

; ESP32: pioarduino's community platform (arduino-esp32 3.x), not the official espressif32.
; It is not in the PlatformIO registry, so the release zip URL is the only way to name a
; version; the tag is pinned so a build here never follows the platform's own moving target.
; Partitions are the board definition's own default_8MB.csv (8MB flash), not overridden here.
[env:xiao_esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
extra_scripts =
    pre:portable_paths.py
    post:package_firmware.py

; M5Stack CoreS3 と CoreS3-SE。中身は同じ ESP32-S3R8（16MB flash / 8MB PSRAM）で、SE で
; 減っているのはカメラ・近接センサ・IMU・地磁気センサと内蔵電池だけなので、build の設定に
; 差は無い。だから env は 1 つで、BOARDS の 2 つのボードがこれを共有する（server.mjs の env）。
; 定義は platform 自身の m5stack-cores3：partitions は default_16MB.csv、USB-C は ESP32-S3 に
; 直結なので extra_flags が -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 を持っている。
[env:m5stack_cores3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = m5stack-cores3
framework = arduino
extra_scripts =
    pre:portable_paths.py
    post:package_firmware.py

; M5Stack StampS3A（M5StampS3A）。載っているのは ESP32-S3FN8 で、8MB flash・PSRAM 無しの
; 最小構成は platform 自身の m5stack-stamps3 の定義そのもの（partitions は default_8MB.csv、
; variant は m5stack_stamp_s3 で、外に出ている 23 本 G0-G15 / G39-G44 / G46 と一致する）なので、
; 自作 json は置かずにそれを流用した。S3A で変わったのは RGB LED の電源経路・アンテナ・
; ボタンの押し心地だけで、build の設定には効かない。
; USB-C は ESP32-S3 の GPIO19/GPIO20 へ直結で USB シリアル変換チップは無く、Serial は内蔵
; USB CDC。m5stack-stamps3 の extra_flags は -DARDUINO_USB_MODE=1 しか持たないので、
; -DARDUINO_USB_CDC_ON_BOOT=1 と揃えてここで明示する。
[env:m5stamp_s3a]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = m5stack-stamps3
framework = arduino
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
extra_scripts =
    pre:portable_paths.py
    post:package_firmware.py

; M5Stack ATOMS3 と ATOMS3 Lite。中身は 2 台とも ESP32-S3FN8（8MB flash・PSRAM 無し）で、
; Lite で減るのは 0.85 インチ LCD と IMU（MPU6886）、増えるのは RGB LED だけなので build の
; 設定に差は無い。だから env は 1 つで、BOARDS の 2 つのボードがこれを共有する（server.mjs の
; env）。定義は platform 自身の m5stack-atoms3：partitions は default_8MB.csv、variant は
; m5stack_atoms3 で、これも 2 台で同じものが使われる。
; USB-C は ESP32-S3 の GPIO19/GPIO20 へ直結で USB シリアル変換チップは無く、Serial は内蔵
; USB CDC。m5stack-atoms3 の extra_flags は -DARDUINO_USB_MODE=1 しか持たないので、
; StampS3A と同じく -DARDUINO_USB_CDC_ON_BOOT=1 と揃えてここで明示する。
[env:m5stack_atoms3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = m5stack-atoms3
framework = arduino
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
extra_scripts =
    pre:portable_paths.py
    post:package_firmware.py
