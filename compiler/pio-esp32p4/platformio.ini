; Dedicated ESP32-P4 project: existing RP2040 / ESP32 / ESP32-S3 / ESP32-C3 / ESP32-C5 /
; ESP8266 environments are unchanged.

; M5Stack Stamp-P4。載っているのは ESP32-P4NRW32（16MB flash・32MB PSRAM）。
; platform 55.03.312 が持つ P4 の定義は 4 つ（esp32-p4 / esp32-p4_r3 / esp32-p4-evboard /
; esp32-p4_r3-evboard）と M5 の Tab5 用の 1 つで、rev で分かれている：
;   esp32-p4 系    chip_variant esp32p4_es・f_cpu 360MHz（rev 3.00 より前のシリコン）
;   esp32-p4_r3 系 chip_variant esp32p4   ・f_cpu 400MHz（rev 3.00 以降）
; 手元の個体の rev が分からないので、rev < 3.00 向けの esp32-p4 の値を既定にする（M5 自身の
; docs が案内する platformio.ini も board = esp32-p4-evboard、つまり esp32p4_es 側）。
; ただし esp32-p4 の定義は 4MB flash で、この板の 16MB とは違う。evboard の定義（16MB・
; default_16MB.csv）は flash は合うが variant が esp32p4（Function EV Board の Ethernet PHY・
; SD スロット・SDIO の配線）で、この板の配線ではない。どちらもそのままでは合わないので、
; 定義は compiler/pio-esp32p4/boards/m5stack-stamp-p4.json に置いた。
; variant も同じ理由でこの project の variants/ に置き、board_build.variants_dir でそこを指す
; （framework 側の pioarduino-build.py が board の build.variants_dir を $PROJECT_DIR からの
; 相対で読む）。compile サーバーは boards/ と同じく variants/ も一時 project へ複写する。
; USB-C は ESP32-P4 の GPIO24（D−）と GPIO25（D+）へ直結で、USB シリアル変換チップは載って
; いない。Serial はチップ内蔵の USB CDC なので、そのフラグをここで明示する。
[env:m5stamp_p4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = m5stack-stamp-p4
framework = arduino
board_build.variants_dir = variants
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
extra_scripts =
    pre:portable_paths.py
    post:package_firmware.py
