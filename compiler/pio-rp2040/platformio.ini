; DigiCode Text — project-local PlatformIO config. No global lib_deps.

; XIAO RP2040: not in the official raspberrypi platform, so use the community
; platform (maxgerhardt) with the earlephilhower arduino-pico core.
[env:xiao_rp2040]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = seeed_xiao_rp2040
framework = arduino
board_build.core = earlephilhower

; Raspberry Pi Pico: same community platform and earlephilhower arduino-pico core
; as XIAO RP2040, so both RP2040 boards build with one core and one uf2 recipe.
[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
board_build.core = earlephilhower
