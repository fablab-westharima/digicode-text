<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>DigiCode Text — slice 1</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; max-width: 1000px; }
  textarea { width: 100%; height: 320px; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  pre { background: #111; color: #ddd; padding: 8px; height: 220px; overflow: auto; font-size: 12px; white-space: pre-wrap; }
  button { margin-right: 8px; padding: 6px 12px; }
  .row { margin: 8px 0; }
</style>
</head>
<body>
<h1>DigiCode Text — slice 1</h1>

<div class="row">
  <label>board
    <select id="env">
      <option value="xiao_rp2040">XIAO RP2040</option>
      <option value="pico">Raspberry Pi Pico</option>
    </select>
  </label>
</div>

<textarea id="src">#include &lt;Arduino.h&gt;

void setup() {
  Serial.begin(115200);
}

void loop() {
  Serial.println("hello");
  delay(1000);
}
</textarea>

<div class="row">
  <button id="build">Build</button>
  <a id="download" hidden download>Download .uf2</a>
  <button id="monitor">Serial monitor (Web Serial)</button>
  <button id="stop" hidden>Stop monitor</button>
  <span id="status"></span>
</div>

<pre id="log"></pre>

<script>
const $ = (id) => document.getElementById(id);
const log = (s) => { $('log').textContent += s + '\n'; $('log').scrollTop = $('log').scrollHeight; };

$('build').onclick = async () => {
  $('build').disabled = true; $('download').hidden = true; $('status').textContent = 'building…';
  $('log').textContent = '';
  const t0 = performance.now();
  try {
    const res = await fetch('/compile', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ env: $('env').value, source: $('src').value }),
    });
    const secs = ((performance.now() - t0) / 1000).toFixed(1);
    if (res.ok) {
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = $('download');
      a.href = url; a.download = `firmware-${$('env').value}.uf2`; a.hidden = false;
      $('status').textContent = `OK ${blob.size} bytes in ${secs}s`;
      log(`build OK: ${blob.size} bytes (${res.headers.get('x-compile-duration-ms')} ms on server)`);
    } else {
      const j = await res.json().catch(() => ({}));
      $('status').textContent = `FAILED (${res.status}) in ${secs}s`;
      log(j.log ?? j.error ?? 'unknown error');
    }
  } catch (e) {
    $('status').textContent = 'request failed'; log(String(e));
  } finally { $('build').disabled = false; }
};

// Web Serial monitor. Not exercised in this slice (no device may be touched yet).
let port, reader, keepReading = false;
$('monitor').onclick = async () => {
  if (!('serial' in navigator)) { log('Web Serial is not available in this browser'); return; }
  try {
    port = await navigator.serial.requestPort({ filters: [{ usbVendorId: 0x2e8a }] }); // Raspberry Pi VID
    await port.open({ baudRate: 115200 });
    $('monitor').hidden = true; $('stop').hidden = false; keepReading = true;
    const decoder = new TextDecoderStream();
    port.readable.pipeTo(decoder.writable);
    reader = decoder.readable.getReader();
    while (keepReading) {
      const { value, done } = await reader.read();
      if (done) break;
      if (value) $('log').textContent += value, $('log').scrollTop = $('log').scrollHeight;
    }
  } catch (e) { log('serial: ' + e); }
};
$('stop').onclick = async () => {
  keepReading = false;
  try { await reader?.cancel(); await port?.close(); } catch {}
  $('monitor').hidden = false; $('stop').hidden = true;
};
</script>
</body>
</html>
