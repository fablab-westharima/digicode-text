<!-- M5Stack ATOMS3 / ATOMS3 Lite の RESET 長押し。外形は usb-c-connect-atoms3.svg と同じ、
     上面の側から見た図で、口とボタンはその辺のふちに重ねて描いている。
     この手順で押すのは左側面の RESET だけなので、そこだけを強調する。2 秒押したままにする
     操作なので、CoreS3 と同じく二重の輪郭で「押し続ける」を表し、矢印は外から本体へ、
     ボタンを押し込む向きに動かす。手前側の面の USB-C はもう挿さっているので強調しない。
     上面の大きなボタンは押さないので、そのまま描く。緑のランプは、docs が「点いたら離す」と
     言うだけで位置を書いていないため描かない（点灯の合図は手順文の側で言う）。
     ケースに文字の印字は無いので、図にも文字は書かない。
     出所は docs.m5stack.com の AtomS3 と AtomS3-Lite の Download Mode と外観写真。
     線画のみ。色は app.css の .flash-figure が変数で与える（この中に色は書かない）。 -->
<svg viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <rect class="fig-board" x="100" y="28" width="120" height="120" rx="11"/>
  <!-- 上面のほぼ全体を占める大きなボタン -->
  <rect class="fig-part" x="112" y="40" width="96" height="96" rx="9"/>
  <!-- 手前側の面: USB-C（挿さっている）と白い HY2.0-4P（PORT.A） -->
  <rect class="fig-part" x="134" y="138" width="38" height="24" rx="4"/>
  <rect class="fig-board fig-thin" x="141" y="145" width="24" height="9" rx="4.5"/>
  <rect class="fig-part" x="182" y="140" width="26" height="14" rx="2"/>
  <!-- 押したままにするボタン: 左側面の RESET。二重の輪郭で「押し続ける」を表す。 -->
  <rect class="fig-hit" x="93" y="84" width="14" height="20" rx="3"/>
  <rect class="fig-accent fig-thin" x="86" y="77" width="28" height="34" rx="8"/>
  <!-- rotate(-90 76 94) の中で fig-press が下へ動く＝画面では右向き＝押し込む向き。 -->
  <g transform="rotate(-90 76 94)">
    <g class="fig-press fig-accent">
      <path d="M76,76 V96"/>
      <path d="M69,87 L76,94 L83,87"/>
    </g>
  </g>
</svg>
