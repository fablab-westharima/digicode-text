<!-- ブラウザのポート選択ダイアログ（Wio Node）。並んだポートのうち、GroveのUSBシリアルの
     「FT234X」を選ぶ。行の名前は画面で実際に見える文字列。
     線画のみ。色は app.css の .flash-figure が変数で与える（この中に色は書かない）。 -->
<svg viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <rect class="fig-board" x="34" y="46" width="252" height="148" rx="6"/>
  <path class="fig-thin" d="M34,76 H286"/>
  <path class="fig-thin" d="M50,62 H136"/>
  <!-- 同じ一覧に並ぶ、別のポート -->
  <g>
    <rect class="fig-thin" x="54" y="91" width="16" height="12" rx="2"/>
    <path class="fig-thin" d="M70,97 H76"/>
    <text class="fig-small" x="84" y="102">USB JTAG/serial debug unit</text>
  </g>
  <!-- 選ぶポートの行 -->
  <g class="fig-appear fig-accent">
    <rect class="fig-hit" x="46" y="118" width="228" height="26" rx="3"/>
    <rect class="fig-thin" x="54" y="125" width="16" height="12" rx="2"/>
    <path class="fig-thin" d="M70,131 H76"/>
    <text class="fig-small" x="84" y="136">FT234X</text>
  </g>
  <!-- 取り消しと接続 -->
  <rect class="fig-part" x="112" y="158" width="74" height="24" rx="4"/>
  <rect class="fig-part fig-accent" x="196" y="158" width="74" height="24" rx="4"/>
</svg>
