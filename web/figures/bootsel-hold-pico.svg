<!-- Raspberry Pi Pico を上から見た平面図。51x21mm の縦長、microUSBは上辺中央、BOOTSELは上寄り左、
     四隅にネジ穴、下辺中央にDEBUGの3パッド。線画のみ。色は app.css の .flash-figure が変数で与える。 -->
<svg viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <rect class="fig-board" x="125" y="58" width="70" height="170" rx="5"/>
  <!-- 20本ずつのパッド -->
  <path class="fig-pad" d="M120,76h11v6h-11zM120,82.8h11v6h-11zM120,89.6h11v6h-11zM120,96.4h11v6h-11zM120,103.2h11v6h-11zM120,110h11v6h-11zM120,116.8h11v6h-11zM120,123.6h11v6h-11zM120,130.4h11v6h-11zM120,137.2h11v6h-11zM120,144h11v6h-11zM120,150.8h11v6h-11zM120,157.6h11v6h-11zM120,164.4h11v6h-11zM120,171.2h11v6h-11zM120,178h11v6h-11zM120,184.8h11v6h-11zM120,191.6h11v6h-11zM120,198.4h11v6h-11zM120,205.2h11v6h-11z"/>
  <path class="fig-pad" d="M189,76h11v6h-11zM189,82.8h11v6h-11zM189,89.6h11v6h-11zM189,96.4h11v6h-11zM189,103.2h11v6h-11zM189,110h11v6h-11zM189,116.8h11v6h-11zM189,123.6h11v6h-11zM189,130.4h11v6h-11zM189,137.2h11v6h-11zM189,144h11v6h-11zM189,150.8h11v6h-11zM189,157.6h11v6h-11zM189,164.4h11v6h-11zM189,171.2h11v6h-11zM189,178h11v6h-11zM189,184.8h11v6h-11zM189,191.6h11v6h-11zM189,198.4h11v6h-11zM189,205.2h11v6h-11z"/>
  <!-- 四隅のネジ穴 -->
  <circle class="fig-board fig-thin" cx="133" cy="66" r="4.5"/>
  <circle class="fig-board fig-thin" cx="187" cy="66" r="4.5"/>
  <circle class="fig-board fig-thin" cx="133" cy="220" r="4.5"/>
  <circle class="fig-board fig-thin" cx="187" cy="220" r="4.5"/>
  <!-- LED、RP2040、DEBUGパッド -->
  <rect class="fig-face" x="135" y="68" width="9" height="6" rx="1"/>
  <rect class="fig-part" x="149" y="131" width="23" height="23" rx="2"/>
  <circle class="fig-pad" cx="148" cy="215" r="2.8"/>
  <circle class="fig-pad" cx="160" cy="215" r="2.8"/>
  <circle class="fig-pad" cx="172" cy="215" r="2.8"/>
  <!-- 挿す先: microUSB -->
  <rect class="fig-part fig-accent" x="144" y="46" width="32" height="16" rx="3"/>
  <rect class="fig-board fig-accent fig-thin" x="151" y="50" width="18" height="6" rx="3"/>
  <!-- 押すボタン: BOOTSEL -->
  <g class="fig-press fig-accent">
    <rect class="fig-hit" x="140" y="88" width="21" height="21" rx="4"/>
    <circle class="fig-hit" cx="150" cy="98" r="7"/>
    <path d="M150,68 V80"/>
    <path d="M143,75 L150,83 L157,75"/>
  </g>
  <text class="fig-accent fig-small" x="114" y="103" text-anchor="end">BOOTSEL</text>
  <!-- USBケーブルは上から差し込む。rotate(90 160 60) の中でfig-cableが横へ動く＝画面では下向き。 -->
  <g transform="rotate(90 160 60)">
    <g class="fig-cable fig-accent">
      <rect class="fig-part fig-accent" x="124" y="46" width="28" height="28" rx="4"/>
      <rect class="fig-part fig-accent" x="106" y="52" width="20" height="16" rx="6"/>
      <path d="M108,60 L60,60"/>
    </g>
  </g>
</svg>
