<!-- M5Stack ATOMS3 / ATOMS3 Lite を上面の側から見た図。24x24mm の角の丸い立方体で、上面の
     ほぼ全体が 1 つの大きなボタンになっている（ATOMS3 はその下に 0.85 インチ LCD が入り、
     Lite は樹脂のまま）。口とボタンは上面ではなく側面にあるので、その辺のふちに重ねて
     描いている（下辺＝手前側の面、左辺＝左側面）。M5 の docs の外観写真から読んだ並びは、
     手前側の面が USB-C と白い HY2.0-4P（PORT.A）、左側面が小さな RESET ボタン。
     底面の 2.54mm ヘッダ 2 列は上から見えないので描かない。
     2 台は上面（LCD かボタンだけか）と高さ（12.9mm と 9.5mm）だけが違い、挿す口も押す
     ボタンも同じ位置なので、図は 2 台で共有する。片方にしか無い LCD と RGB LED の窓は、
     どちらの図としても正しくなるように描いていない。ケースに文字の印字は無い（GPIO の
     名前は底面のシールにしかない）ので、図にも文字は書かない。
     出所は docs.m5stack.com の AtomS3 と AtomS3-Lite の外観写真。
     線画のみ。色は app.css の .flash-figure が変数で与える（この中に色は書かない）。 -->
<svg viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <rect class="fig-board" x="100" y="28" width="120" height="120" rx="11"/>
  <!-- 上面のほぼ全体を占める大きなボタン -->
  <rect class="fig-part" x="112" y="40" width="96" height="96" rx="9"/>
  <!-- 左側面: 小さな RESET ボタン -->
  <rect class="fig-part" x="93" y="84" width="14" height="20" rx="3"/>
  <!-- 手前側の面: USB-C のとなりに白い HY2.0-4P（PORT.A） -->
  <rect class="fig-part" x="182" y="140" width="26" height="14" rx="2"/>
  <!-- 挿す先: 手前側の面の USB-C -->
  <rect class="fig-part fig-accent fig-hit" x="134" y="138" width="38" height="24" rx="4"/>
  <rect class="fig-board fig-accent fig-thin" x="141" y="145" width="24" height="9" rx="4.5"/>
  <!-- USB-Cケーブルは手前から差し込む。rotate(-90 153 190) の中で fig-cable が横へ動く＝
       画面では上向き＝口へ押し込む向き。 -->
  <g transform="rotate(-90 153 190)">
    <g class="fig-cable fig-accent">
      <rect class="fig-part fig-accent" x="145" y="176" width="36" height="28" rx="5"/>
      <rect class="fig-part fig-accent" x="117" y="183" width="30" height="14" rx="6"/>
      <path d="M123,190 L63,190"/>
    </g>
  </g>
</svg>
