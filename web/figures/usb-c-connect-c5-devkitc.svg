<!-- ESP32-C5-DevKitC-1 を上から見た平面図。53.6x25.4mm で、モジュールのアンテナ区画が短辺から
     6.5mm はみ出す（公式の寸法図 v1.2）。向きは Espressif の部品名入り写真と同じ横置き：
     アンテナが左、USB-C 2 口が右辺に縦に並ぶ。上が ESP32-C5 直結の USB 口、下が USB シリアル
     変換チップ側の UART 口で、その変換チップは 2 口の左に描いている。ヘッダは長辺に 16 穴ずつ。
     基板では UART と USB のシルクが 2 つのコネクタの隙間に縦書きで入っているが、この縮尺では
     隙間に文字が入らないので、それぞれの口のすぐ左に置いている。図に書く文字は基板に実際に
     印字されているこの 2 語だけで、どちらに挿すかは手順文の側で言う。
     BOOT と RESET のボタンは 2 口の左にあるが、この手順ではどちらも押さないので描かない。
     この手順で挿すのは USB 口なので、そこだけ強調する。
     線画のみ。色は app.css の .flash-figure が変数で与える（この中に色は書かない）。 -->
<svg viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <!-- 基板の短辺からはみ出すモジュールのアンテナ区画 -->
  <rect class="fig-board fig-thin" x="22" y="99" width="18" height="46" rx="2"/>
  <rect class="fig-board" x="40" y="92" width="150" height="60" rx="4"/>
  <!-- 長辺のヘッダ 16 穴ずつ -->
  <path class="fig-pad" d="M48,87h6v5h-6zM56,87h6v5h-6zM64,87h6v5h-6zM72,87h6v5h-6zM80,87h6v5h-6zM88,87h6v5h-6zM96,87h6v5h-6zM104,87h6v5h-6zM112,87h6v5h-6zM120,87h6v5h-6zM128,87h6v5h-6zM136,87h6v5h-6zM144,87h6v5h-6zM152,87h6v5h-6zM160,87h6v5h-6zM168,87h6v5h-6z"/>
  <path class="fig-pad" d="M48,152h6v5h-6zM56,152h6v5h-6zM64,152h6v5h-6zM72,152h6v5h-6zM80,152h6v5h-6zM88,152h6v5h-6zM96,152h6v5h-6zM104,152h6v5h-6zM112,152h6v5h-6zM120,152h6v5h-6zM128,152h6v5h-6zM136,152h6v5h-6zM144,152h6v5h-6zM152,152h6v5h-6zM160,152h6v5h-6zM168,152h6v5h-6z"/>
  <!-- ESP32-C5-WROOM-1 のシールド面 -->
  <rect class="fig-face" x="40" y="99" width="64" height="46" rx="2"/>
  <!-- USBシリアル変換チップ -->
  <rect class="fig-part" x="120" y="108" width="14" height="16" rx="1"/>
  <!-- 右辺の USB-C 2 口。上が ESP32-C5 直結の USB 口（この手順で挿す方）。 -->
  <rect class="fig-part fig-accent fig-hit" x="178" y="88" width="28" height="26" rx="4"/>
  <rect class="fig-board fig-accent fig-thin" x="186" y="97" width="12" height="8" rx="4"/>
  <rect class="fig-part" x="178" y="126" width="28" height="26" rx="4"/>
  <rect class="fig-board fig-thin" x="186" y="135" width="12" height="8" rx="4"/>
  <text class="fig-small fig-accent" x="172" y="104" text-anchor="end">USB</text>
  <text class="fig-small" x="172" y="146" text-anchor="end">UART</text>
  <!-- USB-Cケーブルは右から差し込む。rotate(180 240 101) の中で fig-cable が横へ動く＝画面では左向き。 -->
  <g transform="rotate(180 240 101)">
    <g class="fig-cable fig-accent">
      <rect class="fig-part fig-accent" x="236" y="87" width="34" height="28" rx="5"/>
      <rect class="fig-part fig-accent" x="208" y="94" width="28" height="14" rx="6"/>
      <path d="M208,101 L162,101"/>
    </g>
  </g>
</svg>
